# A memo on the follow-up's padding theorem. It builds on the follow-up's Lean library
# (and, through it, the first paper's), required through a relative path.
name = "paddingMemo"
defaultTargets = ["PaddingMemo"]

[[require]]
name = "transposeFollowup"
path = "../../lean"

[[lean_lib]]
name = "PaddingMemo"
globs = ["PaddingMemo.+"]
