# Build adapter: mathematical sources remain in the original paper, read-only.
name = "transpose"
srcDir = "../../../Matrix-Transposition-and-the-Tape-Coding-Conjecture/lean"
defaultTargets = ["Transpose"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Transpose"
globs = ["Transpose.+"]
