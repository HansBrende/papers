name = "transpose"
defaultTargets = ["Transpose"]

# Mathlib is used by the proofs. The frozen statement Transpose/Statement.lean does not import it.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Transpose"
globs = ["Transpose.+"]
