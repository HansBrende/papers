# A memo on the frozen gap-area form of the source-cover certificate.
# It builds on the source-cover paper's Lean library, required through a relative path.
name = "gapAreaMemo"
defaultTargets = ["GapAreaMemo"]

[[require]]
name = "sourceCovers"
path = "../../lean"

[[lean_lib]]
name = "GapAreaMemo"
globs = ["GapAreaMemo", "GapAreaMemo.+"]
