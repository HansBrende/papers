# Lean formalization of "Merge Depth, Input Steering, and the Coding Core of Matrix Transposition on Tapes".
# It builds on the Lean libraries of the eighth paper (linear networks, rigidity, Theorem F), the ninth paper
# (admissible geometries and their uniform deficit bounds, for Theorem LA), the fifth paper (paired distances and
# path packing, for Section 4.4) and the tenth paper (the deep nesting pattern, for Section 7), required through
# relative paths.
name = "mergeDepth"
defaultTargets = ["MergeDepth"]

[[require]]
name = "boundedNesting"
path = "../../Bounded-Nesting-and-Depth-Reduction-for-Matrix-Transposition-on-Tapes/lean"

[[require]]
name = "sourceCovers"
path = "../../Source-Covers-and-Barriers-to-Tape-Transposition/lean"

[[require]]
name = "directedRecovery"
path = "../../Directed-Recovery-Structures-in-Tape-Computations/lean"

[[require]]
name = "directedReciprocity"
path = "../../Directed-Reciprocity-and-Deep-Nesting-Bounds-for-Matrix-Transposition-on-Tapes/lean"

[[lean_lib]]
name = "MergeDepth"
globs = ["MergeDepth", "MergeDepth.+"]
