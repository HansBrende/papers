# A memo extending "Order, Symmetry and the Swap". It builds on that paper's Lean library,
# required through a relative path.
name = "classUniformMemo"
defaultTargets = ["ClassUniformMemo"]

[[require]]
name = "swapRigidity"
path = "../../lean"

[[lean_lib]]
name = "ClassUniformMemo"
globs = ["ClassUniformMemo", "ClassUniformMemo.+"]
