# Read-only, hash-checked subset of the pinned openai/math source tree.
# Run verification/fetch_openai_metric.py from the paper before building.
name = "openaiMetric"
srcDir = ".lake/source"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "OAI"
globs = ["OAI.+"]
